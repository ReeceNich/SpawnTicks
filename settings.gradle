pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.kikugie.dev/releases' }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.8.4'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(rootProject) {
        branch('common') {
            versions('1.21.1', '1.21.4')
            vcsVersion = '1.21.1'
        }
        branch('neoforge') {
            versions([
                '1.21.1-neoforge': '1.21.1',
                '1.21.4-neoforge': '1.21.4'
            ])
            vcsVersion = '1.21.1-neoforge'
        }
    }
}

rootProject.name = 'spawnticks'
