plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

def versionProps = new Properties()
def versionPropsFile = file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}

def modVersion = providers.gradleProperty('modVersion')
    .orElse(versionProps.getProperty('mod_version', '1.0.0'))
    .get()
def minecraftVersion = versionProps.getProperty('minecraft_version', '1.21.1')
def minecraftVersionRange = versionProps.getProperty('minecraft_version_range', '[1.21.1,1.21.2)')
def neoforgeVersion = versionProps.getProperty('neoforge_version', '21.1.72')
def neoforgeVersionRange = versionProps.getProperty('neoforge_version_range', '[21.1,)')

version = modVersion
group = 'uk.co.reecenicholls'

base {
    archivesName = 'spawnticks'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neoforgeVersion

    addModdingDependenciesTo(sourceSets.gametest)

    mods {
        spawnticks {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'spawnticks'
        }
    }
}

tasks.named('jar').configure {
    archiveVersion = "${project.version}+mc${minecraftVersion}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        mod_version            : project.version,
        minecraft_version_range: minecraftVersionRange,
        neoforge_version_range : neoforgeVersionRange
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
