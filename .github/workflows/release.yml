name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-tag:
    name: Verify Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify tag matches root gradle.properties
        id: version
        shell: bash
        run: |
          PROP_VERSION="$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          if [ -z "$PROP_VERSION" ]; then
            echo "ERROR: mod_version missing from gradle.properties"
            exit 1
          fi
          EXPECTED_TAG="v${PROP_VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "ERROR: Git tag ($GITHUB_REF_NAME) must match $EXPECTED_TAG."
            exit 1
          fi
          echo "version=$PROP_VERSION" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build & GameTest (${{ matrix.target }})
    needs: verify-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - 1.21.1-neoforge
          - 1.21.4-neoforge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run NeoForge GameTests (${{ matrix.target }})
        run: ./gradlew ":neoforge:${{ matrix.target }}:build" ":neoforge:${{ matrix.target }}:runGameTestServer" --no-daemon

      - name: Upload built mod JAR (${{ matrix.target }})
        uses: actions/upload-artifact@v6
        with:
          name: spawnticks-${{ matrix.target }}
          path: |
            neoforge/versions/${{ matrix.target }}/build/libs/*.jar
            !neoforge/versions/${{ matrix.target }}/build/libs/*-sources.jar

  publish:
    name: Publish GitHub Release & Modrinth
    needs: [verify-tag, build-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download built mod JARs
        uses: actions/download-artifact@v8
        with:
          pattern: spawnticks-*
          path: release-jars

      - name: Extract changelog notes and target metadata
        id: meta
        shell: bash
        run: |
          VER="${{ needs.verify-tag.outputs.version }}"
          python3 -c '
          import pathlib, sys
          ver = sys.argv[1]
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          out, inside = [], False
          prefix = f"## [{ver}]"
          for line in lines:
              if line.startswith(prefix):
                  inside = True
                  continue
              if inside and line.startswith("## ["):
                  break
              if inside:
                  out.append(line)
          pathlib.Path("release_notes.md").write_text("\n".join(out).strip(), encoding="utf-8")
          ' "$VER"

          read_prop() {
            grep -E "^$2=" "$1" | cut -d'=' -f2 | tr -d '[:space:]'
          }

          LABEL_1211="$(read_prop neoforge/versions/1.21.1-neoforge/gradle.properties jar_mc_label)"
          VERS_1211="$(read_prop neoforge/versions/1.21.1-neoforge/gradle.properties modrinth_game_versions | tr ',' '\n')"
          LABEL_1214="$(read_prop neoforge/versions/1.21.4-neoforge/gradle.properties jar_mc_label)"
          VERS_1214="$(read_prop neoforge/versions/1.21.4-neoforge/gradle.properties modrinth_game_versions | tr ',' '\n')"

          echo "label_1211=$LABEL_1211" >> "$GITHUB_OUTPUT"
          echo "label_1214=$LABEL_1214" >> "$GITHUB_OUTPUT"
          {
            echo "game_versions_1211<<EOF"
            echo "$VERS_1211"
            echo "EOF"
            echo "game_versions_1214<<EOF"
            echo "$VERS_1214"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "SpawnTicks v${{ needs.verify-tag.outputs.version }}"
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            release-jars/**/*.jar

      - name: Publish 1.21-1.21.1 NeoForge JAR to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: "SpawnTicks v${{ needs.verify-tag.outputs.version }} (NeoForge ${{ steps.meta.outputs.label_1211 }})"
          version: "${{ needs.verify-tag.outputs.version }}+mc${{ steps.meta.outputs.label_1211 }}-neoforge"
          version-type: release
          changelog-file: release_notes.md
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.game_versions_1211 }}
          files: "release-jars/spawnticks-1.21.1-neoforge/*.jar"

      - name: Publish 1.21.2-1.21.4 NeoForge JAR to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          name: "SpawnTicks v${{ needs.verify-tag.outputs.version }} (NeoForge ${{ steps.meta.outputs.label_1214 }})"
          version: "${{ needs.verify-tag.outputs.version }}+mc${{ steps.meta.outputs.label_1214 }}-neoforge"
          version-type: release
          changelog-file: release_notes.md
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.game_versions_1214 }}
          files: "release-jars/spawnticks-1.21.4-neoforge/*.jar"
